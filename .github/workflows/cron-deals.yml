name: Cron — Sync Deals

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'   # every 6 hours — hotel + flight deals
  workflow_dispatch:

jobs:
  sync-hotel-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync-hotel-deals
        run: |
          curl -f -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.PRODUCTION_URL }}/api/cron/sync-hotel-deals" \
          | grep -qE '^2' || exit 1

  sync-flight-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync-flight-deals
        run: |
          curl -f -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.PRODUCTION_URL }}/api/cron/sync-flight-deals" \
          | grep -qE '^2' || exit 1
