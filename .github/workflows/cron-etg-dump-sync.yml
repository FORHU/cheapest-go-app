name: ETG Dump Sync

on:
  schedule:
    - cron: '0 3 * * *'   # daily at 03:00 UTC — incremental (changes since last run)
  workflow_dispatch:       # allow manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call ETG dump sync endpoint
        env:
          SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          STATUS=$(curl -s -o /tmp/body.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/etg-dump-sync?type=incremental")
          cat /tmp/body.json
          if [ "$STATUS" -ne 200 ]; then
            echo "ETG dump sync failed with HTTP $STATUS"
            exit 1
          fi
