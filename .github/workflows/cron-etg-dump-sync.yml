name: ETG Dump Sync

on:
  schedule:
    - cron: '0 3 * * *'   # daily at 03:00 UTC — incremental (changes since last run)
  workflow_dispatch:       # allow manual trigger from GitHub UI
    inputs:
      type:
        description: 'full or incremental'
        required: false
        default: 'incremental'
      force:
        description: 'Force re-seed already seeded hotels (true/false)'
        required: false
        default: 'false'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 6 hours max — full dump needs time

    steps:
      - uses: actions/checkout@v4

      # pnpm, not npm. Both lockfiles used to be committed and neither tool updated the
      # other, so a dependency added with one left CI installing from a stale lockfile —
      # which is how the AWS SDK reached main with a package-lock.json that did not have
      # it. package-lock.json is gone; pnpm-lock.yaml is the only lockfile now.
      #
      # Pinned to the version the lockfile was produced by, and kept in step with the
      # Dockerfile: pnpm 10 changed lockfile handling mid-series, so an unpinned install
      # can fail on a lockfile nobody has touched.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ETG dump sync
        env:
          DATABASE_URL:     ${{ secrets.DATABASE_URL }}
          ETG_KEY_ID:       ${{ secrets.RATEHAWK_KEY_ID }}
          ETG_API_KEY:      ${{ secrets.RATEHAWK_API_KEY }}
        run: |
          TYPE="${{ github.event.inputs.type || 'incremental' }}"
          FORCE_FLAG=""
          [ "${{ github.event.inputs.force }}" = "true" ] && FORCE_FLAG="--force"
          node scripts/etg-dump-sync.mjs --type "$TYPE" $FORCE_FLAG
