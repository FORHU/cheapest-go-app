name: ETG Dump Sync

on:
  schedule:
    - cron: '0 2 * * *'   # daily at 02:00 UTC — incremental (fast, just changes)
  workflow_dispatch:
    inputs:
      type:
        description: 'Dump type (incremental or full)'
        required: false
        default: 'incremental'
      force:
        description: 'Force re-seed already seeded hotels (true/false)'
        required: false
        default: 'false'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 6 hours — full dump can take a while

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ETG dump sync
        env:
          DATABASE_URL:       ${{ secrets.DATABASE_URL }}
          RATEHAWK_KEY_ID:    ${{ secrets.RATEHAWK_KEY_ID }}
          RATEHAWK_API_KEY:   ${{ secrets.RATEHAWK_API_KEY }}
        run: |
          TYPE="${{ github.event.inputs.type || 'incremental' }}"
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          node scripts/etg-dump-sync.mjs --type "$TYPE" $FORCE_FLAG
