name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options: [staging, production]
      skip_checks:
        description: 'Skip lint and tests (deploy immediately)'
        required: false
        type: boolean
        default: false

jobs:
  check:
    if: github.event_name != 'workflow_dispatch' || inputs.skip_checks == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: pnpm tsc --noEmit

      - name: Test
        run: pnpm test --run

  deploy-staging:
    needs: [check]
    if: |
      always() &&
      (needs.check.result == 'success' || needs.check.result == 'skipped') &&
      (
        (github.ref == 'refs/heads/staging' && github.event_name == 'push') ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
      )
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Trigger Coolify staging deploy
        run: |
          curl -fsSL -X GET "${{ secrets.COOLIFY_STAGING_WEBHOOK }}"

  deploy-production:
    needs: [check]
    if: |
      always() &&
      (needs.check.result == 'success' || needs.check.result == 'skipped') &&
      (
        (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
      )
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Coolify production deploy
        run: |
          curl -fsSL -X GET "${{ secrets.COOLIFY_PRODUCTION_WEBHOOK }}"
