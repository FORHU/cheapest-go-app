name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm, not npm. Both lockfiles used to be committed and neither tool updated the
      # other, so a dependency added with one left CI installing from a stale lockfile —
      # which is how the AWS SDK reached main with a package-lock.json that did not have
      # it. package-lock.json is gone; pnpm-lock.yaml is the only lockfile now.
      #
      # Pinned to the version the lockfile was produced by, and kept in step with the
      # Dockerfile: pnpm 10 changed lockfile handling mid-series, so an unpinned install
      # can fail on a lockfile nobody has touched.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test -- --run

      # A production build, because typecheck and tests cannot see this class of failure.
      #
      # On 2026-09-10 a `useSearchParams` added to the footer took every route out of static
      # generation, and the build died prerendering `/booking/hotel-confirmed` — a page the
      # change never touched. tsc passed. 1,129 tests passed. The first thing that knew was
      # the Docker build, by which point the commit was on main and both brands were
      # deploying.
      #
      # Costs about 100s. Both brands build on every push to main, so finding it here is
      # cheaper than finding it twice in the image step.
      #
      # The NEXT_PUBLIC_* values are placeholders: this proves the build completes and every
      # page prerenders, not that production's configuration is right.
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: https://cheapestgo.com
          NEXT_PUBLIC_BRAND_NAME: CheapestGo
