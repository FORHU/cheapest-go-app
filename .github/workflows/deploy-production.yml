# Deploy CheapestGo to production.
#
# Flow: docker build -> push to ECR -> SSM RunCommand writes the runtime env file,
# pulls the image, restarts the app and its cron sidecar.
# NEXT_PUBLIC_* is inlined at build time (Next.js client + many server routes),
# so those values are build args as well as runtime env.
#
# ---------------------------------------------------------------------------
# Two containers, one image repository:
#   - CONTAINER_NAME      cheapestgo        port 3000, the app
#   - CRON_CONTAINER_NAME cheapestgo-cron   --network host, runs docker/cron/crontab
# The sidecar is rebuilt and recreated on every deploy so the schedule on the box is
# always the crontab in this commit. It reaches the app on localhost:3000 rather than
# the public URL, because /api/internal/* is not meant to be called from outside.
#
# No --platform: the instances are x86 and the runner is x86, so a native build
# matches. Do not copy an arm64 build arg from another repo without checking the
# instance type — an arch mismatch fails at container start, not at build.
#
# ---------------------------------------------------------------------------
# One-time AWS setup:
#
# 1. IAM role for this repo (OIDC). Trust:
#      aud = sts.amazonaws.com
#      sub = repo:FORHU/cheapest-go-app:environment:production
#    Permissions: ECR push/pull on the repository below; ssm:SendCommand on
#      arn:aws:ssm:REGION::document/AWS-RunShellScript and the instance ARN;
#      plus ssm:ListCommands / ListCommandInvocations / GetCommandInvocation.
#
# 2. Instance role: AmazonSSMManagedInstanceCore + ECR pull on the repository.
#    Without the first, SSM cannot reach the box and this workflow cannot run.
#
# ---------------------------------------------------------------------------
# Environment: production
#
# Variables (non-secret):
#   AWS_REGION            e.g. ap-southeast-1
#   ECR_REPOSITORY        e.g. cheapestgo
#   EC2_TARGET_TAG_KEY    Name
#   EC2_TARGET_TAG_VALUE  production-cheapestgo
#   CONTAINER_PORT        e.g. 3000
#   ENV_FILE_PATH         e.g. /opt/cheapestgo/.env
#
# Secrets: AWS_DEPLOY_ROLE_ARN plus the 43 runtime values listed in the deploy job.
#
# NOTE ON SECRETS: the runtime env is base64-encoded into the SSM command, which
# means those values are retrievable from SSM command history and CloudTrail by
# anyone with ssm:GetCommandInvocation on this account. That is acceptable for a
# repo whose variables are all public; ours are not. Moving the env file to an SSM
# Parameter Store SecureString the instance reads for itself would remove that
# exposure and is the intended follow-up.
# ---------------------------------------------------------------------------

name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  CONTAINER_NAME: cheapestgo
  CRON_CONTAINER_NAME: cheapestgo-cron

jobs:
  ci:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: npm test -- --run

  build-and-push:
    name: Build and push image
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: meta
        run: echo "image_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Require public build args
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          MISSING=""
          require_env() { if [[ -z "$2" ]]; then MISSING="${MISSING} $1"; fi; }
          require_env NEXT_PUBLIC_SITE_URL "$NEXT_PUBLIC_SITE_URL"
          require_env NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY "$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY"
          if [[ -n "$MISSING" ]]; then
            echo "Missing required secrets:${MISSING}" >&2
            exit 1
          fi

      - name: Build and push app image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          set -euo pipefail
          docker build \
            --build-arg NEXT_PUBLIC_MAPBOX_TOKEN="${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}" \
            --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY="${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}" \
            --build-arg NEXT_PUBLIC_SITE_URL="${{ secrets.NEXT_PUBLIC_SITE_URL }}" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      # The sidecar runs the operational jobs in docker/cron/crontab — ticket polling,
      # orphaned-order cleanup, email retries, session and cache expiry, destination
      # cache fills. Same repository, distinct tag: no second repo or variable needed.
      - name: Build and push cron sidecar
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          set -euo pipefail
          docker build \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:cron-$IMAGE_TAG" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:cron-latest" \
            ./docker/cron
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:cron-$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:cron-latest"

  deploy:
    name: Deploy via SSM
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve ECR registry
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Send deploy command via SSM
        id: send-command
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          CONTAINER_PORT: ${{ vars.CONTAINER_PORT }}
          ENV_FILE_PATH: ${{ vars.ENV_FILE_PATH }}
          TAG_KEY: ${{ vars.EC2_TARGET_TAG_KEY }}
          TAG_VALUE: ${{ vars.EC2_TARGET_TAG_VALUE }}
          V_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          V_DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          V_DATABASE_SSL: ${{ secrets.DATABASE_SSL }}
          V_NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          V_DUFFEL_ACCESS_TOKEN: ${{ secrets.DUFFEL_ACCESS_TOKEN }}
          V_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          V_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          V_STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          V_TRAVELGATEX_API_KEY: ${{ secrets.TRAVELGATEX_API_KEY }}
          V_TRAVELGATEX_CODE: ${{ secrets.TRAVELGATEX_CODE }}
          V_TRAVELGATEX_SUPPLIER: ${{ secrets.TRAVELGATEX_SUPPLIER }}
          V_TRAVELGATEX_CONTEXT: ${{ secrets.TRAVELGATEX_CONTEXT }}
          V_TRAVELGATEX_CLIENT: ${{ secrets.TRAVELGATEX_CLIENT }}
          V_TRAVELGATEX_ENDPOINT_URL: ${{ secrets.TRAVELGATEX_ENDPOINT_URL }}
          V_RATEHAWK_KEY_ID: ${{ secrets.RATEHAWK_KEY_ID }}
          V_RATEHAWK_API_KEY: ${{ secrets.RATEHAWK_API_KEY }}
          V_ETG_KEY_ID: ${{ secrets.ETG_KEY_ID }}
          V_ETG_API_KEY: ${{ secrets.ETG_API_KEY }}
          V_NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
          V_GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          V_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          V_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          V_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          V_NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ secrets.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
          V_FOURSQUARE_SERVICE_API_KEY: ${{ secrets.FOURSQUARE_SERVICE_API_KEY }}
          V_FLIGHT_MARKUP_PERCENTAGE: ${{ secrets.FLIGHT_MARKUP_PERCENTAGE }}
          V_HOTEL_MARKUP_PERCENTAGE: ${{ secrets.HOTEL_MARKUP_PERCENTAGE }}
          # Added with ADR-0031. The markup is no longer one percentage per product:
          # it has a flat component and a cap, and it is sized against a MEASURED
          # STRIPE_RATE rather than Stripe's headline 2.9%. Shipping only the two
          # percentages leaves the rest on code defaults, which mixes old and new.
          V_FLIGHT_MARKUP_FLAT_USD: ${{ secrets.FLIGHT_MARKUP_FLAT_USD }}
          V_HOTEL_MARKUP_FLAT_USD: ${{ secrets.HOTEL_MARKUP_FLAT_USD }}
          V_MARKUP_CAP: ${{ secrets.MARKUP_CAP }}
          V_STRIPE_RATE: ${{ secrets.STRIPE_RATE }}
          V_STRIPE_FLAT_FEE: ${{ secrets.STRIPE_FLAT_FEE }}
          V_OTV_CREDIT_LIMIT: ${{ secrets.OTV_CREDIT_LIMIT }}
          V_OTV_CREDIT_UTILIZATION_ALERT_PCT: ${{ secrets.OTV_CREDIT_UTILIZATION_ALERT_PCT }}
          V_OTV_DEADLINE_ALERT_HOURS: ${{ secrets.OTV_DEADLINE_ALERT_HOURS }}
          V_DUFFEL_BALANCE_ALERT_THRESHOLD: ${{ secrets.DUFFEL_BALANCE_ALERT_THRESHOLD }}
          V_INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
          V_MOBILE_API_KEY: ${{ secrets.MOBILE_API_KEY }}
          V_CRON_SECRET: ${{ secrets.CRON_SECRET }}
          V_FUNCTIONS_SECRET: ${{ secrets.FUNCTIONS_SECRET }}
          V_CHAT_WONDER_API_URL: ${{ secrets.CHAT_WONDER_API_URL }}
          V_NEXT_PUBLIC_CHAT_WONDER_WS_URL: ${{ secrets.NEXT_PUBLIC_CHAT_WONDER_WS_URL }}
          V_NEXT_PUBLIC_CHAT_WONDER_API_URL: ${{ secrets.NEXT_PUBLIC_CHAT_WONDER_API_URL }}
          V_MYSTIFLY_ACCOUNT_NUMBER: ${{ secrets.MYSTIFLY_ACCOUNT_NUMBER }}
          V_MYSTIFLY_BASE_URL: ${{ secrets.MYSTIFLY_BASE_URL }}
          V_MYSTIFLY_PASSWORD: ${{ secrets.MYSTIFLY_PASSWORD }}
          V_MYSTIFLY_USERNAME: ${{ secrets.MYSTIFLY_USERNAME }}
          V_JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -euo pipefail

          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          CRON_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:cron-$IMAGE_TAG"

          MISSING=""
          require_env() { if [[ -z "$2" ]]; then MISSING="${MISSING} $1"; fi; }
          require_env CONTAINER_PORT "$CONTAINER_PORT"
          require_env ENV_FILE_PATH "$ENV_FILE_PATH"
          require_env EC2_TARGET_TAG_KEY "$TAG_KEY"
          require_env EC2_TARGET_TAG_VALUE "$TAG_VALUE"
          require_env DATABASE_URL "$V_DATABASE_URL"
          require_env JWT_SECRET "$V_JWT_SECRET"
          require_env STRIPE_SECRET_KEY "$V_STRIPE_SECRET_KEY"
          if [[ -n "$MISSING" ]]; then
            echo "Missing required GitHub variables/secrets:${MISSING}" >&2
            exit 1
          fi

          NL=$'\n'
          ENV_CONTENT=""
          # Empty values are skipped rather than written blank: an env key set to the
          # empty string reads as configured-but-empty, which is how a missing secret
          # becomes a runtime failure far from its cause.
          append_env() { if [[ -n "$2" ]]; then ENV_CONTENT="${ENV_CONTENT}${1}=${2}${NL}"; fi; }

          append_env NODE_ENV production
          # 3000 is the port the app listens on INSIDE the container, always. CONTAINER_PORT
          # is the host port it is published on, which differs per brand (AirangGo uses 3001
          # on a shared box). Setting PORT from CONTAINER_PORT would make the app listen on
          # the host port inside the container, leaving the published mapping pointing at
          # nothing — and it would look like a healthy deploy.
          append_env PORT 3000
          append_env DATABASE_URL "$V_DATABASE_URL"
          append_env DATABASE_URL_UNPOOLED "$V_DATABASE_URL_UNPOOLED"
          append_env DATABASE_SSL "$V_DATABASE_SSL"
          append_env NEXT_PUBLIC_SITE_URL "$V_NEXT_PUBLIC_SITE_URL"
          append_env DUFFEL_ACCESS_TOKEN "$V_DUFFEL_ACCESS_TOKEN"
          append_env STRIPE_SECRET_KEY "$V_STRIPE_SECRET_KEY"
          append_env NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY "$V_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY"
          append_env STRIPE_WEBHOOK_SECRET "$V_STRIPE_WEBHOOK_SECRET"
          append_env TRAVELGATEX_API_KEY "$V_TRAVELGATEX_API_KEY"
          append_env TRAVELGATEX_CODE "$V_TRAVELGATEX_CODE"
          append_env TRAVELGATEX_SUPPLIER "$V_TRAVELGATEX_SUPPLIER"
          append_env TRAVELGATEX_CONTEXT "$V_TRAVELGATEX_CONTEXT"
          append_env TRAVELGATEX_CLIENT "$V_TRAVELGATEX_CLIENT"
          append_env TRAVELGATEX_ENDPOINT_URL "$V_TRAVELGATEX_ENDPOINT_URL"
          append_env RATEHAWK_KEY_ID "$V_RATEHAWK_KEY_ID"
          append_env RATEHAWK_API_KEY "$V_RATEHAWK_API_KEY"
          append_env ETG_KEY_ID "$V_ETG_KEY_ID"
          append_env ETG_API_KEY "$V_ETG_API_KEY"
          append_env NEXT_PUBLIC_MAPBOX_TOKEN "$V_NEXT_PUBLIC_MAPBOX_TOKEN"
          append_env GOOGLE_PLACES_API_KEY "$V_GOOGLE_PLACES_API_KEY"
          append_env GOOGLE_CLIENT_ID "$V_GOOGLE_CLIENT_ID"
          append_env GOOGLE_CLIENT_SECRET "$V_GOOGLE_CLIENT_SECRET"
          append_env RESEND_API_KEY "$V_RESEND_API_KEY"
          append_env NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION "$V_NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION"
          append_env FOURSQUARE_SERVICE_API_KEY "$V_FOURSQUARE_SERVICE_API_KEY"
          append_env FLIGHT_MARKUP_PERCENTAGE "$V_FLIGHT_MARKUP_PERCENTAGE"
          append_env HOTEL_MARKUP_PERCENTAGE "$V_HOTEL_MARKUP_PERCENTAGE"
          append_env FLIGHT_MARKUP_FLAT_USD "$V_FLIGHT_MARKUP_FLAT_USD"
          append_env HOTEL_MARKUP_FLAT_USD "$V_HOTEL_MARKUP_FLAT_USD"
          append_env MARKUP_CAP "$V_MARKUP_CAP"
          append_env STRIPE_RATE "$V_STRIPE_RATE"
          append_env STRIPE_FLAT_FEE "$V_STRIPE_FLAT_FEE"
          append_env OTV_CREDIT_LIMIT "$V_OTV_CREDIT_LIMIT"
          append_env OTV_CREDIT_UTILIZATION_ALERT_PCT "$V_OTV_CREDIT_UTILIZATION_ALERT_PCT"
          append_env OTV_DEADLINE_ALERT_HOURS "$V_OTV_DEADLINE_ALERT_HOURS"
          append_env DUFFEL_BALANCE_ALERT_THRESHOLD "$V_DUFFEL_BALANCE_ALERT_THRESHOLD"
          append_env INTERNAL_SECRET "$V_INTERNAL_SECRET"
          append_env MOBILE_API_KEY "$V_MOBILE_API_KEY"
          append_env CRON_SECRET "$V_CRON_SECRET"
          append_env FUNCTIONS_SECRET "$V_FUNCTIONS_SECRET"
          append_env CHAT_WONDER_API_URL "$V_CHAT_WONDER_API_URL"
          append_env NEXT_PUBLIC_CHAT_WONDER_WS_URL "$V_NEXT_PUBLIC_CHAT_WONDER_WS_URL"
          append_env NEXT_PUBLIC_CHAT_WONDER_API_URL "$V_NEXT_PUBLIC_CHAT_WONDER_API_URL"
          append_env MYSTIFLY_ACCOUNT_NUMBER "$V_MYSTIFLY_ACCOUNT_NUMBER"
          append_env MYSTIFLY_BASE_URL "$V_MYSTIFLY_BASE_URL"
          append_env MYSTIFLY_PASSWORD "$V_MYSTIFLY_PASSWORD"
          append_env MYSTIFLY_USERNAME "$V_MYSTIFLY_USERNAME"
          append_env JWT_SECRET "$V_JWT_SECRET"

          ENV_CONTENT_B64=$(printf '%s' "$ENV_CONTENT" | base64 | tr -d '\n')
          ENV_DIR=$(dirname "$ENV_FILE_PATH")

          cat > deploy-remote.sh <<EOF
          set -euo pipefail
          aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}

          sudo mkdir -p ${ENV_DIR}
          echo "${ENV_CONTENT_B64}" | base64 -d | sudo tee ${ENV_FILE_PATH} > /dev/null
          sudo chmod 600 ${ENV_FILE_PATH}

          # Reclaim disk BEFORE pulling, not after.
          #
          # On 2026-09-09 this deploy died on `no space left on device` while pulling the
          # app image, and because the script is `set -e` the containers were never
          # replaced — the previous image kept serving under `--restart unless-stopped`, so
          # the site answered 200 throughout while main had moved on. CI reported the
          # failure correctly; what misled was the healthy site, which is the only signal
          # anyone checks by hand.
          #
          # The cause is that the cleanup below was `docker image prune -f`, which drops
          # only DANGLING images. Every deploy pulls a new `:$IMAGE_TAG` and that tag keeps
          # the old image alive forever, at 1-2 GB each. Cleanup also ran last, after both
          # pulls, so it could never free space for the pull that needed it.
          #
          # `-a` removes every image no CONTAINER references. The running app and cron
          # containers reference theirs, so this cannot pull the site out from under itself;
          # it only reclaims the images previous deploys left behind.
          echo "disk before prune:"; df -h /var/lib/docker | tail -1
          docker image prune -af || true
          docker builder prune -af || true
          echo "disk after prune:"; df -h /var/lib/docker | tail -1

          docker pull ${IMAGE}
          docker stop ${CONTAINER_NAME} >/dev/null 2>&1 || true
          docker rm ${CONTAINER_NAME} >/dev/null 2>&1 || true
          docker run -d \
            --name ${CONTAINER_NAME} \
            --restart unless-stopped \
            -p ${CONTAINER_PORT}:3000 \
            --env-file ${ENV_FILE_PATH} \
            ${IMAGE}

          docker pull ${CRON_IMAGE}
          docker stop ${CRON_CONTAINER_NAME} >/dev/null 2>&1 || true
          docker rm ${CRON_CONTAINER_NAME} >/dev/null 2>&1 || true
          docker run -d \
            --name ${CRON_CONTAINER_NAME} \
            --restart unless-stopped \
            --network host \
            --env-file ${ENV_FILE_PATH} \
            -e APP_URL=http://localhost:${CONTAINER_PORT} \
            ${CRON_IMAGE}

          # Again afterwards: the image the old container was holding is unreferenced now
          # that the new one is running, so this is what actually reclaims the last deploy.
          docker image prune -af || true
          echo "disk after deploy:"; df -h /var/lib/docker | tail -1
          EOF

          PARAMS=$(jq -n --rawfile script deploy-remote.sh \
            '{commands: ($script | split("\n") | map(select(length > 0)))}')

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${CONTAINER_NAME} ${IMAGE_TAG}" \
            --targets "Key=tag:${TAG_KEY},Values=${TAG_VALUE}" \
            --parameters "$PARAMS" \
            --timeout-seconds 600 \
            --output text \
            --query "Command.CommandId")

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Sent SSM command $COMMAND_ID targeting tag:${TAG_KEY}=${TAG_VALUE}"

      - name: Wait for deploy to finish
        env:
          COMMAND_ID: ${{ steps.send-command.outputs.command_id }}
          TAG_KEY: ${{ vars.EC2_TARGET_TAG_KEY }}
          TAG_VALUE: ${{ vars.EC2_TARGET_TAG_VALUE }}
        run: |
          set -euo pipefail

          sleep 8

          STATUS="Pending"
          for i in $(seq 1 40); do
            STATUS=$(aws ssm list-commands --command-id "$COMMAND_ID" \
              --query "Commands[0].Status" --output text 2>/dev/null || echo "Pending")
            if [[ "$STATUS" != "Pending" && "$STATUS" != "InProgress" ]]; then
              break
            fi
            echo "Deploy status: $STATUS (attempt $i/40)"
            sleep 10
          done

          echo "Final command status: $STATUS"

          FAILED=0
          INSTANCE_IDS=$(aws ssm list-command-invocations --command-id "$COMMAND_ID" \
            --query "CommandInvocations[].InstanceId" --output text)

          if [[ -z "$INSTANCE_IDS" ]]; then
            echo "No instances matched tag:${TAG_KEY}=${TAG_VALUE} for this SSM command."
            exit 1
          fi

          for INSTANCE_ID in $INSTANCE_IDS; do
            echo "::group::Instance $INSTANCE_ID"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
              --output json > invocation.json
            cat invocation.json
            INV_STATUS=$(jq -r ".Status" invocation.json)
            if [[ "$INV_STATUS" != "Success" ]]; then
              FAILED=1
            fi
            echo "::endgroup::"
          done

          if [[ "$FAILED" -ne 0 ]]; then
            echo "One or more instances failed to deploy."
            exit 1
          fi

          echo "Deploy succeeded on: $INSTANCE_IDS"
