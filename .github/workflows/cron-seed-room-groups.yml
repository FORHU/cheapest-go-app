name: Seed Room Groups

on:
  schedule:
    - cron: '0 3 * * *'   # daily at 03:00 UTC, after hotel content refresh
  workflow_dispatch:       # allow manual trigger from GitHub UI

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Call seed-room-groups endpoint
        env:
          SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          STATUS=$(curl -s -o /tmp/body.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/seed-room-groups?batch=500")
          cat /tmp/body.json
          if [ "$STATUS" -ne 200 ]; then
            echo "Room group seed failed with HTTP $STATUS"
            exit 1
          fi
