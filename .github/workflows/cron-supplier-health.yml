name: Hotel Supplier Health

on:
  schedule:
    - cron: '20 * * * *'   # hourly, offset so it does not collide with the credit check
  workflow_dispatch:       # allow manual trigger from GitHub UI

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe hotel supplier availability
        env:
          SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          STATUS=$(curl -s -o /tmp/body.json -w "%{http_code}" --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/supplier-health")
          cat /tmp/body.json
          echo
          if [ "$STATUS" -ne 200 ]; then
            echo "Supplier health check failed with HTTP $STATUS"
            exit 1
          fi
