name: Deploy GeoMeego

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: npm test -- --run

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: geomeego

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push GeoMeego image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_REPOSITORY_GEOMEEGO }}
          SHA: ${{ github.sha }}
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_BRAND_NAME="GeoMeego" \
            --build-arg NEXT_PUBLIC_LOCALE="ko" \
            --build-arg NEXT_PUBLIC_SITE_URL="${{ secrets.NEXT_PUBLIC_SITE_URL_GEOMEEGO }}" \
            --build-arg NEXT_PUBLIC_BRAND_EMAIL="${{ secrets.NEXT_PUBLIC_BRAND_EMAIL_GEOMEEGO }}" \
            --build-arg NEXT_PUBLIC_BRAND_FAVICON="${{ secrets.NEXT_PUBLIC_BRAND_FAVICON_GEOMEEGO }}" \
            --build-arg NEXT_PUBLIC_MAPBOX_TOKEN="${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}" \
            --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY="${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}" \
            -t $REGISTRY/$REPOSITORY:$SHA \
            -t $REGISTRY/$REPOSITORY:latest \
            .
          docker push $REGISTRY/$REPOSITORY:$SHA
          docker push $REGISTRY/$REPOSITORY:latest

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY_GEOMEEGO }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.EC2_HOST_GEOMEEGO }}" >> ~/.ssh/known_hosts || true
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Write .env to GeoMeego EC2
        env:
          V_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          V_DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          V_DATABASE_SSL: ${{ secrets.DATABASE_SSL }}
          V_NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL_GEOMEEGO }}
          V_DUFFEL_ACCESS_TOKEN: ${{ secrets.DUFFEL_ACCESS_TOKEN }}
          V_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          V_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          V_STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET_GEOMEEGO }}
          V_TRAVELGATEX_API_KEY: ${{ secrets.TRAVELGATEX_API_KEY }}
          V_TRAVELGATEX_CODE: ${{ secrets.TRAVELGATEX_CODE }}
          V_TRAVELGATEX_SUPPLIER: ${{ secrets.TRAVELGATEX_SUPPLIER }}
          V_TRAVELGATEX_CONTEXT: ${{ secrets.TRAVELGATEX_CONTEXT }}
          V_TRAVELGATEX_CLIENT: ${{ secrets.TRAVELGATEX_CLIENT }}
          V_TRAVELGATEX_ENDPOINT_URL: ${{ secrets.TRAVELGATEX_ENDPOINT_URL }}
          V_RATEHAWK_KEY_ID: ${{ secrets.RATEHAWK_KEY_ID }}
          V_RATEHAWK_API_KEY: ${{ secrets.RATEHAWK_API_KEY }}
          V_ETG_KEY_ID: ${{ secrets.ETG_KEY_ID }}
          V_ETG_API_KEY: ${{ secrets.ETG_API_KEY }}
          V_NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
          V_GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          V_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          V_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          V_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          V_AWS_VOICE_REGION: ${{ secrets.AWS_VOICE_REGION }}
          V_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          V_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          V_AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}
          V_NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ secrets.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION_GEOMEEGO }}
          V_FOURSQUARE_SERVICE_API_KEY: ${{ secrets.FOURSQUARE_SERVICE_API_KEY }}
          V_FLIGHT_MARKUP_PERCENTAGE: ${{ secrets.FLIGHT_MARKUP_PERCENTAGE }}
          V_HOTEL_MARKUP_PERCENTAGE: ${{ secrets.HOTEL_MARKUP_PERCENTAGE }}
          V_OTV_CREDIT_LIMIT: ${{ secrets.OTV_CREDIT_LIMIT }}
          V_OTV_CREDIT_UTILIZATION_ALERT_PCT: ${{ secrets.OTV_CREDIT_UTILIZATION_ALERT_PCT }}
          V_OTV_DEADLINE_ALERT_HOURS: ${{ secrets.OTV_DEADLINE_ALERT_HOURS }}
          V_DUFFEL_BALANCE_ALERT_THRESHOLD: ${{ secrets.DUFFEL_BALANCE_ALERT_THRESHOLD }}
          V_INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
          V_MOBILE_API_KEY: ${{ secrets.MOBILE_API_KEY }}
          V_CRON_SECRET: ${{ secrets.CRON_SECRET }}
          V_FUNCTIONS_SECRET: ${{ secrets.FUNCTIONS_SECRET }}
          V_CHAT_WONDER_API_URL: ${{ secrets.CHAT_WONDER_API_URL }}
          V_NEXT_PUBLIC_CHAT_WONDER_WS_URL: ${{ secrets.NEXT_PUBLIC_CHAT_WONDER_WS_URL }}
          V_NEXT_PUBLIC_CHAT_WONDER_API_URL: ${{ secrets.NEXT_PUBLIC_CHAT_WONDER_API_URL }}
          V_MYSTIFLY_ACCOUNT_NUMBER: ${{ secrets.MYSTIFLY_ACCOUNT_NUMBER }}
          V_MYSTIFLY_BASE_URL: ${{ secrets.MYSTIFLY_BASE_URL }}
          V_MYSTIFLY_PASSWORD: ${{ secrets.MYSTIFLY_PASSWORD }}
          V_MYSTIFLY_USERNAME: ${{ secrets.MYSTIFLY_USERNAME }}
        run: |
          printf '%s\n' \
            "DATABASE_URL=$V_DATABASE_URL" \
            "DATABASE_URL_UNPOOLED=$V_DATABASE_URL_UNPOOLED" \
            "DATABASE_SSL=$V_DATABASE_SSL" \
            "NEXT_PUBLIC_SITE_URL=$V_NEXT_PUBLIC_SITE_URL" \
            "DUFFEL_ACCESS_TOKEN=$V_DUFFEL_ACCESS_TOKEN" \
            "STRIPE_SECRET_KEY=$V_STRIPE_SECRET_KEY" \
            "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=$V_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY" \
            "STRIPE_WEBHOOK_SECRET=$V_STRIPE_WEBHOOK_SECRET" \
            "TRAVELGATEX_API_KEY=$V_TRAVELGATEX_API_KEY" \
            "TRAVELGATEX_CODE=$V_TRAVELGATEX_CODE" \
            "TRAVELGATEX_SUPPLIER=$V_TRAVELGATEX_SUPPLIER" \
            "TRAVELGATEX_CONTEXT=$V_TRAVELGATEX_CONTEXT" \
            "TRAVELGATEX_CLIENT=$V_TRAVELGATEX_CLIENT" \
            "TRAVELGATEX_ENDPOINT_URL=$V_TRAVELGATEX_ENDPOINT_URL" \
            "RATEHAWK_KEY_ID=$V_RATEHAWK_KEY_ID" \
            "RATEHAWK_API_KEY=$V_RATEHAWK_API_KEY" \
            "ETG_KEY_ID=$V_ETG_KEY_ID" \
            "ETG_API_KEY=$V_ETG_API_KEY" \
            "NEXT_PUBLIC_MAPBOX_TOKEN=$V_NEXT_PUBLIC_MAPBOX_TOKEN" \
            "GOOGLE_PLACES_API_KEY=$V_GOOGLE_PLACES_API_KEY" \
            "GOOGLE_CLIENT_ID=$V_GOOGLE_CLIENT_ID" \
            "GOOGLE_CLIENT_SECRET=$V_GOOGLE_CLIENT_SECRET" \
            "RESEND_API_KEY=$V_RESEND_API_KEY" \
            "AWS_VOICE_REGION=$V_AWS_VOICE_REGION" \
            "AWS_ACCESS_KEY_ID=$V_AWS_ACCESS_KEY_ID" \
            "AWS_SECRET_ACCESS_KEY=$V_AWS_SECRET_ACCESS_KEY" \
            "AWS_S3_BUCKET_NAME=$V_AWS_S3_BUCKET_NAME" \
            "NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION=$V_NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION" \
            "FOURSQUARE_SERVICE_API_KEY=$V_FOURSQUARE_SERVICE_API_KEY" \
            "FLIGHT_MARKUP_PERCENTAGE=$V_FLIGHT_MARKUP_PERCENTAGE" \
            "HOTEL_MARKUP_PERCENTAGE=$V_HOTEL_MARKUP_PERCENTAGE" \
            "OTV_CREDIT_LIMIT=$V_OTV_CREDIT_LIMIT" \
            "OTV_CREDIT_UTILIZATION_ALERT_PCT=$V_OTV_CREDIT_UTILIZATION_ALERT_PCT" \
            "OTV_DEADLINE_ALERT_HOURS=$V_OTV_DEADLINE_ALERT_HOURS" \
            "DUFFEL_BALANCE_ALERT_THRESHOLD=$V_DUFFEL_BALANCE_ALERT_THRESHOLD" \
            "INTERNAL_SECRET=$V_INTERNAL_SECRET" \
            "MOBILE_API_KEY=$V_MOBILE_API_KEY" \
            "CRON_SECRET=$V_CRON_SECRET" \
            "FUNCTIONS_SECRET=$V_FUNCTIONS_SECRET" \
            "CHAT_WONDER_API_URL=$V_CHAT_WONDER_API_URL" \
            "NEXT_PUBLIC_CHAT_WONDER_WS_URL=$V_NEXT_PUBLIC_CHAT_WONDER_WS_URL" \
            "NEXT_PUBLIC_CHAT_WONDER_API_URL=$V_NEXT_PUBLIC_CHAT_WONDER_API_URL" \
            "MYSTIFLY_ACCOUNT_NUMBER=$V_MYSTIFLY_ACCOUNT_NUMBER" \
            "MYSTIFLY_BASE_URL=$V_MYSTIFLY_BASE_URL" \
            "MYSTIFLY_PASSWORD=$V_MYSTIFLY_PASSWORD" \
            "MYSTIFLY_USERNAME=$V_MYSTIFLY_USERNAME" \
          | ssh -i ~/.ssh/id_rsa ${{ secrets.EC2_USER_GEOMEEGO }}@${{ secrets.EC2_HOST_GEOMEEGO }} \
              "cat > ~/.env && chmod 600 ~/.env"

      - name: Deploy to GeoMeego EC2
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_REPOSITORY_GEOMEEGO }}
          REGION: ${{ secrets.AWS_REGION }}
          HOST: ${{ secrets.EC2_HOST_GEOMEEGO }}
          USER: ${{ secrets.EC2_USER_GEOMEEGO }}
        run: |
          ECR_PASSWORD=$(aws ecr get-login-password --region "$REGION")
          IMAGE="$REGISTRY/$REPOSITORY:latest"

          ssh -i ~/.ssh/id_rsa "$USER@$HOST" bash -s << EOF
            echo "$ECR_PASSWORD" | docker login --username AWS --password-stdin $REGISTRY
            docker pull $IMAGE
            docker stop geomeego 2>/dev/null || true
            docker rm   geomeego 2>/dev/null || true
            docker run -d \
              --name geomeego \
              --restart=always \
              -p 3000:3000 \
              --env-file ~/.env \
              $IMAGE
            docker image prune -f
          EOF
