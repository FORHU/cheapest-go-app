services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cheapestgo
      POSTGRES_PASSWORD: cheapestgo
      POSTGRES_DB: cheapestgo
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cheapestgo"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        - NEXT_PUBLIC_MAPBOX_TOKEN
        - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        - NEXT_PUBLIC_SITE_URL
    # 3001, NOT 3000. This container talks to live RDS (below), while `npm run dev`
    # reads .env and talks to local postgres on 5433. Both used to publish 3000, so
    # http://localhost:3000 meant either "local database" or "live database" depending
    # on which happened to be running — and a booking made against the wrong one issued
    # a real airline order. Different ports, no ambiguity.
    ports:
      - "3001:3000"
    env_file:
      - .env
    environment:
      # Deliberately overrides the DATABASE_URL that env_file loaded: .env points at
      # local postgres for `npm run dev`, this container points at live RDS. Separate
      # variable names keep both in .env at once without one shadowing the other.
      #
      # These were inline connection strings until the repository was found to be
      # public, so the credential must be rotated and is now read from .env — which is
      # gitignored — rather than committed. Nothing here may hold a secret value.
      # `:?` fails the container at startup rather than silently falling back to the
      # local database, which is the mistake the port split above exists to prevent.
      DATABASE_URL: ${RDS_DATABASE_URL:?set RDS_DATABASE_URL in .env — see .env.example}
      DATABASE_URL_UNPOOLED: ${RDS_DATABASE_URL_UNPOOLED:-${RDS_DATABASE_URL}}
      DATABASE_SSL: "require"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  cron:
    # Opt-in: `docker compose --profile cron up -d`. Deliberately NOT started by a
    # plain `docker compose up`.
    #
    # This sidecar curls the app service, and the app service talks to live RDS (see
    # the comment above it). So bringing it up runs all 12 production jobs — ticket
    # polling, orphaned-order cleanup, email retries, refunds — from a laptop, in
    # parallel with the sidecar production already runs. Wanting to look at live data
    # and wanting to drive production's schedule are different intentions, and
    # without this profile the first silently implied the second.
    #
    # Nothing was harmed by the period when it did: auto-refunds carry a Stripe
    # idempotency key (`refund-awaiting-<bookingId>`) and order cleanup tolerates
    # `already_cancelled`. That is one good key, not a design — do not rely on the
    # next job inheriting it. Start this profile only to exercise a specific job.
    profiles: ["cron"]
    build:
      context: ./docker/cron
    restart: unless-stopped
    init: true
    environment:
      APP_URL: http://app:3000
      CRON_SECRET: ${CRON_SECRET}
    depends_on:
      - app

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@cheapestgo.com}
      # Publishes on 5051 and can reach the databases above, so it does not get a
      # committed password either — even a weak one, and even bound to localhost.
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?set PGADMIN_PASSWORD in .env}
    ports:
      - "5051:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
