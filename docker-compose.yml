services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cheapestgo
      POSTGRES_PASSWORD: cheapestgo
      POSTGRES_DB: cheapestgo
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cheapestgo"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        - NEXT_PUBLIC_MAPBOX_TOKEN
        - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        - NEXT_PUBLIC_SITE_URL
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  cron:
    build:
      context: ./docker/cron
    restart: unless-stopped
    init: true
    environment:
      APP_URL: http://app:3000
      CRON_SECRET: ${CRON_SECRET}
    depends_on:
      - app

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cheapestgo.com
      PGADMIN_DEFAULT_PASSWORD: cheapestgo
    ports:
      - "5051:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
